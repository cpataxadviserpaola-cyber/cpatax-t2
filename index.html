<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Each page's title, description, keywords, canonical URL, and sharing tags come from
         src/data/seo.js, and are written in here for every page when the site is built. -->
    <title>CPA Tax Adviser</title>
    <meta name="theme-color" content="#1d0a10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The site's own fonts (see "Fonts" in src/styles.css), fetched alongside the scripts so
         the first screen renders in them without a visible swap. -->
    <link rel="preload" href="/src/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
